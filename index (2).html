<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan Earthquake Watch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#d5dbe2;--accent:#b3261e;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--panel:#1d252e;--ink:#e8edf2;--muted:#97a4b2;--line:#2e3a46;--accent:#ff6b5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:1.3rem;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.lang button{border:1px solid var(--line);background:none;color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer}
.lang button:first-child{border-radius:var(--r) 0 0 var(--r)}
.lang button:last-child{border-radius:0 var(--r) var(--r) 0;border-left:0}
.lang button.on{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 24px;max-width:1300px;margin:0 auto}
aside,.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
select,input[type=range]{width:100%}
select{padding:8px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.mag{font-weight:700;color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat b{display:block;font-size:1.5rem;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
h2{font-size:1rem;margin:16px 0 8px}
ol{list-style:none;margin:0;padding:0}
ol li button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:.85rem;padding:8px 0;cursor:pointer;display:flex;gap:10px}
ol li button:hover{color:var(--accent)}
.chip{flex:none;min-width:38px;text-align:center;border-radius:6px;font-weight:700;color:#fff;padding:0 4px}
.right{display:grid;gap:16px;min-width:0}
#map{height:min(58vh,520px);min-height:340px;border-radius:var(--r);border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.chartbox{height:220px;position:relative}
#msg{color:var(--accent);font-size:.9rem;margin:8px 0 0}
footer{padding:16px 24px;text-align:center;color:var(--muted);font-size:.8rem}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px}header{padding:12px}}
</style>
</head>
<body>
<header>
  <div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div>
  <div class="lang" role="group" aria-label="Language">
    <button id="en" class="on">EN</button><button id="ja">日本語</button>
  </div>
</header>
<main>
  <aside>
    <label for="range" data-i="range"></label>
    <select id="range"><option value="1" data-i="d1"></option><option value="7" selected data-i="d7"></option><option value="30" data-i="d30"></option></select>
    <label for="mag"><span data-i="minmag"></span>: <span class="mag" id="magv">M3.0</span></label>
    <input id="mag" type="range" min="2.5" max="7" step="0.1" value="3">
    <div class="stats">
      <div class="stat"><b id="sCount">–</b><span data-i="count"></span></div>
      <div class="stat"><b id="sMax">–</b><span data-i="strongest"></span></div>
      <div class="stat"><b id="sDepth">–</b><span data-i="depth"></span></div>
      <div class="stat"><b id="sLast">–</b><span data-i="latest"></span></div>
    </div>
    <h2 data-i="top"></h2>
    <ol id="top"></ol>
    <p id="msg" role="status"></p>
  </aside>
  <div class="right">
    <div>
      <div id="map" aria-label="Map of recent earthquakes in Japan"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="box">
      <h2 style="margin-top:0" data-i="perday"></h2>
      <div class="chartbox"><canvas id="chart"></canvas></div>
    </div>
  </div>
</main>
<footer data-i="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const T={
 en:{title:"Japan Earthquake Watch",sub:"Live earthquakes in and around Japan",range:"Time range",d1:"Last 24 hours",d7:"Last 7 days",d30:"Last 30 days",minmag:"Minimum magnitude",count:"Earthquakes",strongest:"Strongest",depth:"Avg depth (km)",latest:"Latest",top:"Strongest events",perday:"Earthquakes per day (JST)",foot:"Data: USGS Earthquake Hazards Program. Times shown in JST. Not an official warning system; for alerts see JMA.",loading:"Loading data…",err:"Could not load data from USGS. Check your connection and change a filter to retry.",none:"No earthquakes match these filters.",depthL:"Depth",km:"km",ago:"ago",m:"min",h:"h",d:"d",legendM:"Magnitude"},
 ja:{title:"日本地震ウォッチ",sub:"日本周辺のリアルタイム地震情報",range:"期間",d1:"過去24時間",d7:"過去7日間",d30:"過去30日間",minmag:"最小マグニチュード",count:"地震の件数",strongest:"最大規模",depth:"平均の深さ (km)",latest:"最新",top:"規模の大きい地震",perday:"1日あたりの地震数（日本時間）",foot:"データ：USGS地震災害プログラム。時刻は日本時間。公的な警報ではありません。緊急情報は気象庁をご確認ください。",loading:"データを読み込み中…",err:"USGSからデータを取得できませんでした。接続を確認し、条件を変更して再試行してください。",none:"条件に合う地震はありません。",depthL:"深さ",km:"km",ago:"前",m:"分",h:"時間",d:"日",legendM:"マグニチュード"}
};
let lang="en",quakes=[],chart=null;
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];
const colorOf=m=>m<3?"#6fa3b8":m<4?"#d9a521":m<5?"#e8833a":m<6?"#d1432f":"#8c1d40";
const radiusOf=m=>2.2*Math.pow(m,1.25);
const jst=ms=>new Date(ms).toLocaleString(lang==="ja"?"ja-JP":"en-GB",{timeZone:"Asia/Tokyo",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const dayKey=ms=>new Date(ms).toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"});
function ago(ms){const mins=Math.max(1,Math.round((Date.now()-ms)/60000));
 if(mins<60)return mins+t("m")+" "+t("ago").trim();
 const h=Math.round(mins/60); if(h<48)return h+t("h")+" "+t("ago");
 return Math.round(h/24)+t("d")+" "+t("ago");}

const map=L.map("map",{minZoom:4}).setView([37.5,138],5);
const dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
const esri="https://server.arcgisonline.com/ArcGIS/rest/services/";
const credit="Tiles © Esri";
const tone=dark?"Dark":"Light";
const gray=L.layerGroup([
 L.tileLayer(esri+"Canvas/World_"+tone+"_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:12,attribution:credit}),
 L.tileLayer(esri+"Canvas/World_"+tone+"_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:12})
]).addTo(map);
const streets=L.tileLayer(esri+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:12,attribution:credit});
L.control.layers({"Gray":gray,"Streets":streets},null,{position:"topright"}).addTo(map);
const layer=L.layerGroup().addTo(map);

function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $("en").classList.toggle("on",lang==="en");$("ja").classList.toggle("on",lang==="ja");
 $("legend").innerHTML=`<span>${t("legendM")}:</span>`+[["<3",2.5],["3–4",3.5],["4–5",4.5],["5–6",5.5],["6+",6.5]].map(([l,m])=>`<span><i style="background:${colorOf(m)}"></i>${l}</span>`).join("");
 render();
}

async function load(){
 const days=+$("range").value;
 $("msg").textContent=t("loading");
 const start=new Date(Date.now()-days*864e5).toISOString();
 const url="https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&orderby=time&limit=2000&minmagnitude=2.5"+
  "&minlatitude=24&maxlatitude=46&minlongitude=122&maxlongitude=148&starttime="+start;
 try{
  const r=await fetch(url); if(!r.ok)throw new Error(r.status);
  const j=await r.json();
  quakes=j.features.map(f=>({mag:f.properties.mag,place:f.properties.place,time:f.properties.time,url:f.properties.url,
   lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],depth:f.geometry.coordinates[2]})).filter(q=>q.mag!=null);
  $("msg").textContent="";
 }catch(e){quakes=[];$("msg").textContent=t("err");}
 render();
}

function render(){
 const min=+$("mag").value, days=+$("range").value;
 $("magv").textContent="M"+min.toFixed(1);
 const list=quakes.filter(q=>q.mag>=min);
 layer.clearLayers();
 list.forEach(q=>{
  L.circleMarker([q.lat,q.lon],{radius:radiusOf(q.mag),color:colorOf(q.mag),weight:1,fillColor:colorOf(q.mag),fillOpacity:.45})
   .bindPopup(`<b>M${q.mag.toFixed(1)}</b> ${q.place||""}<br>${jst(q.time)} (${ago(q.time)})<br>${t("depthL")}: ${q.depth.toFixed(0)} ${t("km")}<br><a href="${q.url}" target="_blank" rel="noopener">USGS</a>`)
   .addTo(layer);
 });
 const top=[...list].sort((a,b)=>b.mag-a.mag).slice(0,5);
 $("sCount").textContent=list.length;
 $("sMax").textContent=top.length?"M"+top[0].mag.toFixed(1):"–";
 $("sDepth").textContent=list.length?Math.round(list.reduce((s,q)=>s+q.depth,0)/list.length):"–";
 $("sLast").textContent=list.length?ago(list[0].time):"–";
 $("top").innerHTML=top.map((q,i)=>`<li><button data-i2="${i}"><span class="chip" style="background:${colorOf(q.mag)}">${q.mag.toFixed(1)}</span><span>${q.place||""}<br><small style="color:var(--muted)">${jst(q.time)}</small></span></button></li>`).join("");
 $("top").querySelectorAll("button").forEach(b=>b.onclick=()=>{const q=top[+b.dataset.i2];map.flyTo([q.lat,q.lon],7);});
 if(!$("msg").textContent.startsWith(t("err").slice(0,6))&&quakes.length&&!list.length)$("msg").textContent=t("none");
 else if(list.length&&$("msg").textContent===t("none"))$("msg").textContent="";
 drawChart(list,days);
}

function drawChart(list,days){
 const keys=[];for(let i=days-1;i>=0;i--)keys.push(dayKey(Date.now()-i*864e5));
 const counts=Object.fromEntries(keys.map(k=>[k,0]));
 list.forEach(q=>{const k=dayKey(q.time);if(k in counts)counts[k]++;});
 const labels=days===1?[dayKey(Date.now())]:keys.map(k=>k.slice(5));
 const style=getComputedStyle(document.documentElement);
 const ink=style.getPropertyValue("--muted"),line=style.getPropertyValue("--line"),acc=style.getPropertyValue("--accent");
 if(chart)chart.destroy();
 chart=new Chart($("chart"),{type:"bar",data:{labels,datasets:[{data:keys.map(k=>counts[k]),backgroundColor:acc}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
   scales:{x:{ticks:{color:ink,maxTicksLimit:10},grid:{display:false}},y:{beginAtZero:true,ticks:{color:ink,precision:0},grid:{color:line}}}}});
}

$("range").onchange=load;
$("mag").oninput=render;
$("en").onclick=()=>{lang="en";applyLang();};
$("ja").onclick=()=>{lang="ja";applyLang();};
applyLang();load();
</script>
</body>
</html>
